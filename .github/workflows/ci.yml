name: API build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SteamMuseum.sln
      - run: dotnet build SteamMuseum.sln --no-restore --configuration Release
      - name: Tests with SQLite
        run: dotnet test SteamMuseum.sln --no-build --configuration Release
      - name: Tests with MySQL migrations and concurrent writes
        run: dotnet test SteamMuseum.sln --no-build --configuration Release
        env:
          MUSEUM_TEST_MYSQL: Server=127.0.0.1;Port=3306;User=root;Password=ci-disposable-password;SslMode=Disabled
